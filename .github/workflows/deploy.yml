name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # Пока секреты не заданы, шаг тихо пропускается — CI при этом остаётся зелёным.
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull and restart
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -se <<'REMOTE'
            set -euo pipefail
            cd "${{ secrets.VPS_PATH }}"
            git fetch --all
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
          REMOTE

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://79-137-248-221.sslip.io/api/health"; then
              echo "healthy"
              exit 0
            fi
            sleep 5
          done
          echo "health check failed"
          exit 1
