name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PUBLIC_URL: https://79-137-248-221.sslip.io

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # Пока переменная репозитория DEPLOY_ENABLED не выставлена в "true",
    # job тихо пропускается — сервер ещё не настроен, CI при этом зелёный.
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull and restart
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "set -eu; cd '$VPS_PATH'; git fetch --all; git reset --hard origin/main; docker compose up -d --build; docker image prune -f"

      - name: Health check
        run: |
          for _ in $(seq 1 24); do
            if curl -fsS "$PUBLIC_URL/api/health"; then
              echo
              echo "prototype is live"
              exit 0
            fi
            sleep 5
          done
          echo "health check failed after 2 minutes"
          exit 1
